<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>予約ページ</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
        body { font-family: sans-serif; background-color: #fcfbf9; padding: 20px; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .input-box { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { padding: 10px; border: none; border-radius: 8px; cursor: pointer; background: #8e7f7f; color: white; width: 100%; margin-bottom: 5px; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #time-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .selected-slot { background: #d9a0a0 !important; }
        .memo-text { font-size: 0.85em; color: #666; background: #f9f9f9; padding: 5px; border-radius: 4px; display: block; margin-top: 5px; }
        .section-title { margin-top: 28px; margin-bottom: 12px; font-size: 1.1em; }
        .status-card { border: 1px solid #eee; border-radius: 12px; padding: 15px; margin-bottom: 12px; line-height: 1.6; }
        .next-booking { background: #fffaf8; }
        .past-booking { background: #f8f7f4; }
        .empty-card { background: #fafafa; color: #777; }
        .status-label { font-size: 0.8em; color: #8e7f7f; font-weight: bold; margin-bottom: 6px; }
        .status-date { font-size: 1.1em; margin-bottom: 6px; }
        .help-text { color: #777; font-size: 0.85em; line-height: 1.6; margin-top: 0; }
        .complete-card { display:none; border: 1px solid #e8d2d2; background: #fff7f7; border-radius: 12px; padding: 15px; margin: 18px 0; line-height: 1.7; }
        .complete-title { color: #8e7f7f; font-weight: bold; margin-bottom: 6px; }
        .danger-note { color:red; font-size:0.8em; margin-bottom:0; }
        .small-button { width:auto; margin-top:10px; padding:8px 12px; }

        .holiday-notice {
            background: #fffaf8;
            border: 1px solid #eadbd3;
            color: #6d4c41;
            border-radius: 10px;
            padding: 12px;
            margin: 0 0 12px;
            font-size: 0.88em;
            line-height: 1.7;
        }

        .holiday-title {
            font-weight: bold;
            color: #5d4037;
            margin-bottom: 4px;
        }

        .line-contact-btn {
            background: #06c755;
            color: white;
            margin-left: 6px;
        }

        .memo-template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 10px;
        }

        .template-button {
            width: auto;
            background: #f0e8e4;
            color: #6d4c41;
            border: 1px solid #e0d3cd;
            font-size: 0.8em;
            padding: 7px 10px;
            margin: 0;
        }

        .closed-message {
            grid-column: 1 / -1;
            background: #fff7f4;
            border: 1px solid #e8d2c8;
            color: #6d4c41;
            padding: 14px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 0.9em;
        }
    </style>
<meta content="SALON-FRONTEND-API3-20260822" name="dpro-frontend-version"/></head>
<body>
<div class="container">
<h2 id="user-display">読み込み中...</h2>
<div class="complete-card" id="complete-message"></div>
<h3 class="section-title">ご予約状況</h3>
<div id="booking-list">読み込み中...</div>
<h3 class="section-title">新しく予約する</h3>
<p class="help-text">
        次回予約がある場合は、上の「次回のご予約」をご確認のうえ、ご予約ください。<br/>
        一度ご予約いただいたお客様は、次回からお名前が自動で入力されます。
    </p>
<label>お客様名（フルネーム）</label>
<input class="input-box" id="customer_name" placeholder="山田 太郎" type="text"/>
<label>担当スタッフを選択</label>
<select class="input-box" id="select_staff" onchange="renderTimeSlots()">
<option value="お任せ">お任せ（指定なし）</option>
</select>
<label>予約希望日</label>
<input class="input-box" id="select_date" onchange="renderTimeSlots()" type="date"/>
<div class="holiday-notice" id="holiday-notice">
<div class="holiday-title">休業日のご案内</div>
        読み込み中...
    </div>
<label>備考（任意）</label>
<div class="memo-template-buttons">
<button class="template-button" onclick="applyMemoTemplate('前回と同じ内容でお願いします。')" type="button">前回と同じ</button>
<button class="template-button" onclick="applyMemoTemplate('相談しながら決めたいです。')" type="button">相談したい</button>
<button class="template-button" onclick="applyMemoTemplate('急ぎではないので、当日相談しながら決めたいです。')" type="button">急ぎではない</button>
<button class="template-button" onclick="applyMemoTemplate('できれば時間通りに開始したいです。')" type="button">時間通り希望</button>
</div>
<input class="input-box" id="customer_memo" placeholder="例：前回と同じ内容でお願いします" type="text"/>
<div id="time-slots"></div>
<input id="selected_datetime" type="hidden"/>
<button id="save_btn" onclick="saveBooking()" style="margin-top:20px;">予約を確定</button>
<button onclick="clearForm()" style="background:#aaa;">入力内容をクリア</button>
</div>

<script src="salon-api3-common.js"></script><script src="salon-index-api3.js"></script></body>
</html>
