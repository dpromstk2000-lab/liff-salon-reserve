<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>スタッフ予約確認</title>

<style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #fcfbf9;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .booking-item {
            border-bottom: 1px solid #eee;
            padding: 15px 0;
            line-height: 1.6;
        }

        .booking-item:last-child {
            border-bottom: none;
        }

        .date-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
        }

        select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background: #8e7f7f;
            color: white;
            cursor: pointer;
        }

        .sub-button {
            background: #aaa;
            width: 100%;
            margin: 6px 0 14px;
        }

        .section-title {
            margin-top: 24px;
            margin-bottom: 10px;
            font-size: 1.05em;
            font-weight: bold;
            color: #5f4f4f;
        }

        .summary-card {
            background: #fffaf8;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .next-card {
            background: #fff6f2;
            border: 1px solid #ead6cc;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            line-height: 1.7;
        }

        .next-label {
            font-size: 0.85em;
            color: #8e7f7f;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .next-time {
            font-size: 1.35em;
            font-weight: bold;
            color: #4e342e;
            margin-bottom: 6px;
        }

        .empty-text {
            color: #777;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .memo {
            color: #666;
            background: #f9f9f9;
            padding: 5px;
            border-radius: 4px;
            display: block;
            margin-top: 5px;
            font-size: 0.85em;
        }

        .time {
            font-weight: bold;
            font-size: 1.05em;
        }

        .staff-name {
            color: #8e7f7f;
            font-size: 0.9em;
        }

        .reload-button {
            width: 100%;
            margin-top: 8px;
            background: #795548;
        }
    </style>
<meta content="SALON-FRONTEND-API3-20260822" name="dpro-frontend-version"/></head>
<body>
<div class="container">
<h3>スタッフ予約確認</h3>
<div id="content" style="display:none;">
<div class="next-card" id="next-booking-card">
<div class="next-label">次の予約</div>
<div class="empty-text">読み込み中...</div>
</div>
<div class="summary-card">
<div class="section-title" style="margin-top:0;">本日の予約一覧</div>
<div id="today-booking-list">読み込み中...</div>
<button class="reload-button" onclick="reloadAll()">最新情報に更新</button>
</div>
<div class="section-title">担当者別に確認</div>
<label>担当者を選択</label>
<select id="staff-selector" onchange="fetchStaffBookings()">
<option value="">-- 名前を選択 --</option>
</select>
<div class="date-nav">
<button onclick="changeDate(-1)">← 前日</button>
<h4 id="display-date"></h4>
<button onclick="changeDate(1)">翌日 →</button>
</div>
<button class="sub-button" onclick="goToday()">今日に戻る</button>
<div id="staff-booking-list"></div>
</div>
</div>

<script src="salon-api3-common.js"></script><script src="salon-staff-api3.js"></script></body>
</html>
